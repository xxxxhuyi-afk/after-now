<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>After Now / PPT 优化器</title>
<style>
    [hidden]{display:none !important;}
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#17191b;background:#eeeae2}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:24px 5vw;border-bottom:1px solid #17191b33}.brand{font-family:Georgia,serif;font-size:1.45rem}.meta{font:11px monospace;letter-spacing:.08em;text-transform:uppercase}.modePicker{padding:42px 5vw 24px;text-align:center}.modePicker h1{font:2.4rem Georgia,serif;margin:0 0 10px}.modePicker p{color:#777}.modeCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:900px;margin:28px auto}.modeCard{background:#f7f4ed;border:1px solid #17191b33;border-radius:12px;padding:18px;text-align:left;display:flex;flex-direction:column}.modeCard h2{margin:12px 0 8px;font-size:1.25rem}.modeCard p{line-height:1.6;min-height:3.2em;margin-bottom:22px}.modeCard button{width:100%;padding:12px;border:1px solid #17191b;background:#17191b;color:#fff;cursor:pointer;border-radius:999px;margin-top:auto}.modeCard figure{height:150px;margin:0;border-radius:8px;background:#dfe5e5 center/cover no-repeat;overflow:hidden}.modeCard:nth-child(1) figure{background-image:url('/ppt/ui-plan.svg')}.modeCard:nth-child(2) figure{background-image:url('/ppt/ui-outline.svg')}.outlineShell{max-width:1200px;text-align:center;margin:0 auto;padding:30px 5vw 80px}.templateTitle{font:2.2rem Georgia,serif;margin:0}.templateIntro{color:#777}.templateGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:30px auto;max-height:72vh;overflow:auto;text-align:center}.templateCard{border:2px solid transparent;cursor:pointer}.templateCard.selected{border-color:#293b43}.templateThumb{height:120px;border-radius:8px;background:linear-gradient(135deg,#f8f7f3 50%,#dfe5e5 50%);border:1px solid #17191b22}.templateCard:nth-child(2n) .templateThumb{background:linear-gradient(135deg,#202124 50%,#fa93fa 50%)}.templateCard:nth-child(3n) .templateThumb{background:linear-gradient(135deg,#fff 50%,#dfe5e5 50%)}.templateCard span{display:block;margin-top:8px;font-size:.85rem}.outlineShell{max-width:1200px;margin:0 auto;padding:30px 5vw 80px}.outlineTop{display:flex;justify-content:space-between;align-items:center}.outlineTop h1{font:2.2rem Georgia,serif}.outlineList{display:grid;gap:12px;margin-top:20px}.outlineItem{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:start;border:1px solid #17191b33;border-radius:10px;background:#f7f4ed;padding:16px}.outlineItem input,.outlineItem textarea{width:100%;background:#fff;border:1px solid #17191b22;padding:10px;font:inherit}.outlineItem textarea{height:76px}.outlineItem button{border:0;background:transparent;font-size:1.2rem;cursor:pointer}.outlineActions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.outlineActions button{padding:12px 28px;border:1px solid #17191b;background:#17191b;color:#fff;cursor:pointer}.shell{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 78px)}aside{padding:34px 5vw 60px;border-right:1px solid #17191b33}.stage{padding:42px 5vw;background:#e5e1d8;display:flex;align-items:center;justify-content:center}.label{font:11px monospace;text-transform:uppercase;letter-spacing:.1em;margin:25px 0 10px;display:block}.input,textarea{width:100%;border:1px solid #17191b55;background:#f7f4ed;padding:12px;font:inherit}textarea{height:100px;resize:vertical}.drop{border:1px dashed #17191b88;padding:22px 14px;text-align:center;background:#f7f4ed;cursor:pointer}.drop input{display:none}.drop strong{display:block;font-size:1rem}.drop span{display:block;margin-top:8px;font-size:.75rem;color:#777}.refPreview{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.refPreview img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid #17191b33}.styleRef{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.styleRef i{display:block;height:44px;border:1px solid #17191b55}.styleRef i:nth-child(1){background:linear-gradient(135deg,#f8f7f3 50%,#222 50%)}.styleRef i:nth-child(2){background:linear-gradient(135deg,#202124 50%,#fa93fa 50%)}.styleRef i:nth-child(3){background:linear-gradient(135deg,#fff 50%,#dfe5e5 50%)}.slide [contenteditable=true]{outline:1px dashed transparent}.slide [contenteditable=true]:focus{outline-color:#fa93fa}.styles{display:grid;gap:9px}.style{border:1px solid #17191b55;background:#f7f4ed;padding:12px;text-align:left;cursor:pointer}.style.active{background:#17191b;color:#f7f4ed}.swatch{height:24px;margin-bottom:9px;background:#f7f4ed;border:1px solid #aaa}.style:nth-child(2) .swatch{background:#222;color:#fff}.style:nth-child(3) .swatch{background:#e8ff43}.button{width:100%;border:0;background:#17191b;color:#fff;padding:14px;margin-top:22px;cursor:pointer;font-weight:600}.deck{width:min(900px,100%);aspect-ratio:16/9;background:#f8f7f3;box-shadow:0 18px 55px #17191b22;position:relative;overflow:hidden}.slide{position:absolute;inset:0;padding:7%;display:none}.slide.active{display:block}.slide h1{font:clamp(2rem,5vw,5rem) Georgia,serif;line-height:.98;margin:5% 0 2%}.slide h2{font-size:clamp(1.2rem,2.7vw,2.7rem);margin:0 0 5%}.slide p{font-size:clamp(.7rem,1.25vw,1.1rem);line-height:1.65;color:#777;max-width:64%}.cover .heroimg{position:absolute;right:0;bottom:0;width:55%;height:52%;object-fit:cover;mix-blend-mode:multiply}.chapter{background:#1e1d1b;color:#f4efe6}.chapter p{color:#c9c2b6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:5%}.grid img{width:100%;aspect-ratio:1;object-fit:cover}.slide img{max-width:100%;max-height:55%;object-fit:contain}.nav{position:absolute;bottom:20px;right:25px;display:flex;gap:8px}.nav button{border:1px solid #17191b55;background:#f7f4ed;padding:7px 11px;cursor:pointer}.hint{font-size:12px;color:#777;margin-top:12px}@media(max-width:800px){.shell{grid-template-columns:1fr}.stage{min-height:70vh}aside{border-right:0;border-bottom:1px solid #17191b33}.stage{padding:28px 5vw}.deck{width:100%}}
.deck.swiss{background:#202124;color:#f5f5f2}.deck.swiss .slide p{color:#b9babd}.deck.swiss .chapter{background:#fa93fa;color:#17191b}.deck.swiss .chapter p{color:#3f3045}.deck.white{background:#fff;color:#111}.deck.white .slide p{color:#666}.deck.white .chapter{background:#eef0f0;color:#111}.deck.white .chapter p{color:#666}.deck.white .nav button,.deck.swiss .nav button{background:transparent;color:inherit;border-color:currentColor}</style>
</head><body>
<header><div class="brand">After Now / PPT Optimizer</div><div class="meta">Independent prototype · v0.1</div></header>
<section class="modePicker" id="modePicker"><h1>PPT生成模式</h1><p>选择你想要的生成模式，开启创作之旅</p><div class="modeCards"><article class="modeCard"><figure></figure><h2>基于方案生成</h2><p>上传方案效果图，灵活勾选所需内容，一键生成专业排版 PPT。</p><button data-mode="reference">选择</button></article><article class="modeCard"><figure></figure><h2>基于大纲生成</h2><p>输入主题和大纲，智能生成可编辑的演示结构。</p><button data-mode="outline">选择</button></article></div></section><section class="outlineShell" id="outlineShell" hidden><h1 class="templateTitle">模板选择</h1><p class="templateIntro">选择适合你的方式，快速生成演示大纲</p><div class="templateGrid" id="templateGrid"></div><div class="outlineActions"><button id="outlineBack">上一步</button><button id="outlineNext">开始生成</button></div></section><main class="shell" id="editorShell" hidden><aside>
<label class="label" for="title">Project title</label><input class="input" id="title" value="展览整体策划">
<label class="label" for="brief">Project brief</label><textarea id="brief">为项目建立一个完整、连贯且具有感染力的叙事。</textarea>

<label class="label">Optimization style</label><div class="styleRef" aria-label="风格参考"><i title="电子杂志参考"></i><i title="瑞士网格参考"></i><i title="建筑白底参考"></i></div><div class="styles"><button class="style active" data-style="magazine"><div class="swatch"></div>电子杂志 · 电子墨水</button><button class="style" data-style="swiss"><div class="swatch"></div>瑞士网格 · 信息汇报</button><button class="style" data-style="white"><div class="swatch"></div>建筑方案 · 白底网格</button></div>
<button class="button" id="generate">生成优化预览 ↗</button><button class="button export" id="export">导出可编辑 PPTX ↓</button><p class="hint">生成后可直接点击标题和正文编辑；图片与风格会同步到预览。</p>
</aside><section class="stage"><div class="deck" id="deck"><article class="slide active cover"><div class="meta">AFTER NOW / OPTIMIZED DECK</div><h1>你的项目<br>值得被看见。</h1><p>上传内容并选择风格，先从一套有秩序的叙事开始。</p></article><div class="nav"><button id="prev">←</button><button id="next">→</button></div></div></section></main>
<script>
const state={style:'magazine',images:[],mode:'reference'};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;document.querySelector('#modePicker').hidden=true;document.querySelector('#editorShell').hidden=false});const title=document.querySelector('#title'),brief=document.querySelector('#brief'),deck=document.querySelector('#deck'),fileNote=document.querySelector('#fileNote');
document.querySelectorAll('.style').forEach(b=>b.onclick=()=>{document.querySelectorAll('.style').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.style=b.dataset.style});
const imageInput=document.querySelector('#images');if(imageInput)imageInput.onchange=e=>{state.images=[...e.target.files];fileNote.textContent=state.images.length?`${state.images.length} 张图片已选择`:'还没有选择图片'};
function generate(){const name=title.value||'未命名项目',copy=brief.value||'从问题出发，建立清晰的设计叙事。';let imgs=state.images.map(f=>URL.createObjectURL(f));deck.className="deck "+state.style;index=0;deck.querySelectorAll('.slide').forEach(s=>s.remove());let pages=[`<div class="meta">PROJECT / 01</div><h1>${name}</h1><p>${copy}</p>`,`<div class="meta">CONCEPT / 02</div><h2>从背景到方法</h2><p>${copy} 我们将素材重新组织为清晰的章节，让每一张图都有自己的位置。</p>`];if(imgs.length)pages.push(`<div class="meta">VISUAL INDEX / 03</div><h2>参考与证据</h2><div class="grid">${imgs.slice(0,6).map(x=>`<img src="${x}">`).join('')}</div>`);pages.push(`<div class="meta">TAKEAWAY / 0${pages.length+1}</div><h1>让想法<br>成为作品。</h1><p>一套由 After Now 整理的演示结构。</p>`);pages.forEach((html,i)=>{const el=document.createElement('article');el.className='slide '+(i===0?'active ':'')+(i===1?'chapter ':'');el.innerHTML=html;el.querySelectorAll('h1,h2,p').forEach(node=>node.contentEditable='true');deck.insertBefore(el,deck.querySelector('.nav'))})}
document.querySelector('#generate').onclick=generate;document.querySelector('#export').onclick=async()=>{const slides=[...deck.querySelectorAll('.slide')].map(s=>({title:s.querySelector('h1,h2')?.innerText||'',body:[...s.querySelectorAll('p')].map(p=>p.innerText).join('\\n')}));const res=await fetch('/api/ppt/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,style:state.style,slides})});if(!res.ok){alert('导出失败，请稍后重试');return}const blob=await res.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(title.value||'after-now-deck')+'.pptx';a.click();URL.revokeObjectURL(a.href)};let index=0;function move(d){const slides=[...deck.querySelectorAll('.slide')];if(!slides.length)return;slides[index].classList.remove('active');index=(index+d+slides.length)%slides.length;slides[index].classList.add('active')}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);
</script><script src="/ppt/outline.js"></script></body></html>
